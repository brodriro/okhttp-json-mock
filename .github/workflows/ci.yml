name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Compiles the library and the sample, runs the tests, ktlint and Android lint.
      - name: Build
        run: ./gradlew build

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: '**/build/reports/'

  # Builds an outside project against the published artifact with several Kotlin compilers,
  # which is what catches metadata or dependency problems the library's own tests cannot see.
  consumer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - kotlin: 1.9.25
          - kotlin: 2.0.21
          - kotlin: 2.2.21
          - kotlin: 2.4.21
          - kotlin: 2.4.21
            okhttp: 5.5.0
    name: consumer (Kotlin ${{ matrix.kotlin }}${{ matrix.okhttp && format(', OkHttp {0}', matrix.okhttp) || '' }})
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Old Kotlin plugins do not run on the Gradle of the wrapper, so the consumer uses its own.
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.10.2

      - name: Publish the library to the local Maven repository
        run: ./gradlew :okhttp-json-mock:publishToMavenLocal

      - name: Run the consumer project
        run: >
          gradle -p consumer-test run
          -PkotlinVersion=${{ matrix.kotlin }}
          ${{ matrix.okhttp && format('-PokhttpVersion={0}', matrix.okhttp) || '' }}
