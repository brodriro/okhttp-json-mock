name: Snapshot

# Publishes the library to the Maven Central snapshot repository on every push to develop,
# but only while the version in the build ends in -SNAPSHOT. A release version is never
# published from here: releases go through release.yml and a tag.
on:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the library version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' okhttp-json-mock/build.gradle.kts)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-SNAPSHOT) echo "snapshot=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "snapshot=false" >> "$GITHUB_OUTPUT"; echo "Version $version is not a snapshot, nothing to publish." ;;
          esac

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: steps.version.outputs.snapshot == 'true'
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: steps.version.outputs.snapshot == 'true'

      - name: Publish ${{ steps.version.outputs.version }}
        if: steps.version.outputs.snapshot == 'true'
        run: ./gradlew :okhttp-json-mock:check :okhttp-json-mock:publishToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
