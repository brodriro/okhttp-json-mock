name: Feature request
description: Propose something the library does not do yet
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation in your project, not the solution. A concrete request and the response you need help most.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you handle it today?
      description: A workaround, another tool, or nothing.
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you imagine it working, for example the name of a mock file or a builder option.
