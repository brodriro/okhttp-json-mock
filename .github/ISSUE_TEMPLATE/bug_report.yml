name: Bug report
description: Something does not work as the documentation says
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Library version
      placeholder: 4.0.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OkHttp version, Kotlin or Java version, and Android or plain JVM.
      placeholder: OkHttp 4.12.0, Kotlin 2.2.21, Android
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Request and mock files
      description: The method and URL of the request, and the paths of the mock files involved.
      placeholder: |
        GET https://example.com/api/v1/users/7
        assets/api/v1/users/{id}.json
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log line of the interceptor
      description: The line that starts with "JsonMockServer:" for that request. It says which files were looked for.
      render: text
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: How the interceptor is created
      description: The builder or constructor call, and your InputStreamProvider if it is not a plain file or asset lookup.
      render: kotlin
