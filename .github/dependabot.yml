version: 2

updates:
  - package-ecosystem: gradle
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "[change]"
    ignore:
      # The library supports OkHttp from 4.12 on; compiling against 5.x would drop 4.x users.
      - dependency-name: com.squareup.okhttp3:okhttp
        update-types: [version-update:semver-major]
      # JUnit 6 needs Java 17 and the library is built for Java 8.
      - dependency-name: org.junit:junit-bom
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "[change]"
